name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck entrypoint.sh tests/*.sh tests/stubs/*
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      - name: Compose files
        run: tests/compose.sh
      - name: systemd unit
        run: |
          cp systemd/actions-runner@.service "$RUNNER_TEMP/actions-runner@ci.service"
          systemd-analyze verify "$RUNNER_TEMP/actions-runner@ci.service"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: actions-runner-docker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke tests
        run: tests/smoke.sh actions-runner-docker:ci
      - name: systemd unit commands
        run: tests/systemd.sh
